<!--
<h2>페르시안 고양이란?</h2>   // 아래는 "시맨틱 블록 태그"로 작성.

개요: 페르시안(Persian Cat)은 중장모종에 속하는 고양이다.

역사: 원래 이란의 북동부 호라산에서 오래전부터 사육되었던 것으로 유명하다. 과거의 서양에서 부르던 이란 국명은 페르시아였기에 이 묘종의 명칭은 페르시안이 되었다.

16세기쯤에 이들이 이탈리아로 수입되었다. 이후 유럽에서는 페르시안과 타 중장모종 고양이 사이에서 무분별한 교배가 이루어졌다. 수 세기 동안의 이종 교배가 지속되면서 페르시안 순종 내에서는 귀 모양, 얼굴 모양, 털 길이 등에서 미묘하게 편차가 커지기 시작했다. 현대에 이르러서 이종 교배종과 순종 간의 구별이 쉽지 않은 상황에 이르렀다. 학계에서는 이러한 결과를 바탕으로 페르시안과 유전적으로 친척인 터키시 앙고라의 특성이 현대 페르시안 개체에게 일정 부분 유전된 것으로 추정하고 있다.

1950년대 후반, 오렌지 태비 패턴의 털을 지닌 페르시안 혈통에서 동시다발적인 돌연변이가 발생하여 페키 페이스(Peke Face) 형태의 페르시안이 탄생했다. 이후 페르시안 순종끼리의 선택적 교배(Selective Breeding)를 통해 페키 페이스의 특성을 지닌 페르시안 개체가 늘어났다. 현재는 위 사진처럼 페키페이스 페르시안만이 페르시안으로 인정되고 있다. 즉 일반적인 고양이 얼굴은 페르시안이 아니다. 현재 대부분의 캣클럽에서는 돌페이스 페르시안은 페르시안으로 인정하지 않지만 펫샵이나 일상에서는 아직 돌페이스도 페르시안으로 부르고 있다.

소수의 페르시안 브리더들은 예전처럼 짧고 납짝하지만 과하게 눌리지 않은 돌 페이스 (doll face) 페르시안을 보존차원에서 따로 번식시키고 있다고는 하나, 인정해주는 협회가 적다보니 그만두거나 브리딩 품종 변경한 곳들이 많아서 막상 순종 돌페이스 페르시안을 입양하려하면 한국에서는 찾을 수 없다. 물론 순종이 찾기 힘들다는 거지, 펫샵에서 파는 잡종 페르시안은 많다.

길고양이부터 품종묘까지, 소수의 자연발생종을 제외한 대부분의 장모종은 페르시안에서 파생되었으며 자연발생종이라고 해도 유전자검사를 이용한 근원조사에서 조상에 페르시안이 섞였다는 결과가 많다. 코비~세미코비 체형 품종들도 대부분 품종을 만들 때 페르시안과 교잡을 시켜서 짧은 코를 만들었으며 품종관련 연구에서 페르시안 계열로 분류되고는 한다. 그래서 코비체형이거나 장모인 품종들이 페르시안의 유전병을 공유하는 모습을 볼 수 있다.

-->
