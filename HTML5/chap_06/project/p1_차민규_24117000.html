<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>가위 바위 보 게임</title>
    <link rel="stylesheet" href="style_js.css" />
  </head>
  <body>
    <script>
      document.write("이름: 차민규, 학번:24117000 <hr>");
      /* 이하 부터 가위 바위 보 게임 코드 작성 */
      let user = parseInt(prompt("가위=0, 바위=1, 보=2를 입력하세요"));
      let com = Math.floor(Math.random() * 3);

      if (user == 0 || user == 1 || user == 2) {
        document.write("<h3>User</h3>");
        document.write("<img src='../media/rpc" + user + ".png'>");
        document.write("<h3>Com</h3>");
        document.write("<img src='../media/rpc" + com + ".png'>");
        document.write("<hr><h3>게임 결과</h3>");

        if (user == com) {
          document.write("비겼습니다 !");
        } else if (
          (user == 0 && com == 2) ||
          (user == 1 && com == 0) ||
          (user == 2 && com == 1)
        ) {
          document.write("User가 이겼습니다");
        } else {
          document.write("Com이 이겼습니다");
        }
      }
    </script>
  </body>
</html>
