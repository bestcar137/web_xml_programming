https://www.w3schools.com/css/css_challenges_borders.asp

Instructions
Inside the editor, complete the following steps:
  1. Give p.solid a solid border style
  2. Give p.dashed a dashed border style
  3. Give p.thick a border using the shorthand: 3px solid red
  4. Give p.rounded a solid border and a border-radius of 5px
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    p.solid {
      /* solid border */
      border-style: solid;
    }

    p.dashed {
      /* dashed border */
      border-style: dashed;
    }

    p.thick {
      /* shorthand border */
      border: 3px solid red;
    }

    p.rounded {
      /* solid border + border-radius */
      border-style: solid;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<p class="solid">A solid border.</p>
<p class="dashed">A dashed border.</p>
<p class="thick">A thick red border.</p>
<p class="rounded">A rounded border.</p>

</body>
</html>
