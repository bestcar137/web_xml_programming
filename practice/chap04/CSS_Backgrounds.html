<!--
https://www.w3schools.com/css/css_challenges_background.asp

Instructions
Inside the editor, complete the following steps:
  1. In the body selector, set background-color to lightblue
  2. In the body selector, set background-image to url('img_tree.png')
  3. In the body selector, set background-repeat to no-repeat
  4. In the body selector, set background-position to right top
  -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS Background</title>
  <style>
    body {
      /* background-color */
      background-color: lightblue;
      /* background-image */
      background-image: url('img_tree.png');
      /* background-repeat */
      background-repeat: no-repeat;
      /* background-position */
      background-position: right top;
    }
  </style>
</head>
<body>

<h1>CSS Background</h1>
<p>A background color and a background image can be set together. The color shows where the image does not cover.</p>

</body>
</html>
