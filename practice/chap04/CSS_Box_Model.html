<!--
https://www.w3schools.com/css/css_challenges_boxmodel.asp

Instructions
Inside the editor, complete the following steps:
  1. Set the div width to 300px
  2. Add 25px of padding (space inside the border)
  3. Add a border of 5px solid navy
  4. Add 20px of margin (space outside the border)
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS_Box_Model</title>
  <style>
    div {
      background-color: lightgray;
      /* width */
      width: 300px;
      /* padding (inside) */
      padding: 25px;
      /* border */
      border: 5px solid navy;
      /* margin (outside) */
      margin: 20px;
    }
  </style>
</head>
<body>

<p>The CSS box model wraps every element: margin, border, padding, content.</p>
<div>This box has all four parts of the box model.</div>

</body>
</html>
