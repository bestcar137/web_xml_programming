<!--변형 실습-->
<!--1. h1을 h2로 바꾸었을 때 화면이 어떻게 달라지는가?-->
<!--2. 문단 3개를 추가하고 내용 바꾸기-->
<!--3. 주석을 2개 넣기-->
<!--4. 적당한 곳에 수평선이나 문자 꾸미기 태그를 3개 이상 적용하기-->


<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>나의 홈페이지</title>
</head>

<body>
<h2>나의 홈페이지</h2>
<!--기존 <h1>나의 홈페이지</h1>-->
<!--"나의 홈페이지" 글자가 조금 작아짐-->
<h2>자기 소개</h2>
<hr>
<!--수평선 만들기 단일 태그-->
<p><b>안녕하세요. 웹프로그래밍을 공부하고 있습니다.</b></p>
<p><b><i>저는 새로운 웹사이트를 만들어 보고 싶습니다.</i></b></p>
<p>저는 24학번 차민규 입니다.</p>
<p>이번 학기에 웹/xml 프로그래밍 수업을 듣고 있습니다.</p>
<p>
  <small>잘 부탁드립니다.</small>
</p>
</body>

</html>
