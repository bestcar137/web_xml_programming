<!-- 오늘의 요일을 한글로 출력하는 코드를 작성하시오. -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>오늘 요일 한글로 출력하기</title>
    <link rel="stylesheet" href="style_js.css" />
  </head>
  <body>
    <script>
      let today = new Date();
      const day = "일월화수목금토";
      document.write("오늘은 " + day[today.getDay()] + "요일 입니다.");
    </script>
  </body>
</html>
