<!-- str = "거꾸로 타는 보일러"를 거꾸로 출력하는 코드를 작성하시오. -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>거꾸로 타는 보일러</title>
    <link rel="stylesheet" href="style_js.css" />
  </head>
  <body>
    <script>
      let str = "거꾸로 타는 보일러";

      for (let i = str.length - 1; i >= 0; i--) {
        document.write(str[i]);
      }
    </script>
  </body>
</html>
