<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>자기 소개서 작성</title>
  <!--  실습 1. 텍스트 입력, input, textarea, datalist 를 사용하여 아래와 같이 실행되도록 해보시오. -->
</head>

<body>
<h2>자기 소개서 작성</h2>
<hr>

<p>
  <b>이름: </b>
  <input type="text">
</p>

<p>
  <b>암호: </b>
  <input type="password" placeholder="비밀번호">
</p>

<p>
  <b>자소서:</b>
  <textarea rows="5">이곳에 자기소개서 작성</textarea>
</p>

<hr>

<p>
  <b>나라:</b>
  <input type="text" list="country">
  <datalist id="country">
    <option>가나</option>
    <option>스위스</option>
    <option>브라질</option>
  </datalist>
</p>

</body>
</html>
