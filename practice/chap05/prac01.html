<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>전환</title>

  <style>
    span {
      transition: font-size 5s; /* transition: 5s; 이렇게 해도 무방! */
    }

    span:hover {
      /** 5초에 걸쳐 500%까지 글자 키우는 전환 효과 시작 */
      font-size: 500%;
    }
  </style>
</head>

<body>
<h3>font-size에 대한 전환</h3>
<hr>
<p>
  <span>꽝!</span>
  글자에 마우스를 올려보세요.
</p>
</body>
</html>
